version: '3.8'

networks:
  osrs-net:
    driver: bridge

volumes:
  postgres-data:
  airflow-logs:
  airflow-dags:
  clickhouse-data:

services:
  # --- Database (PostgreSQL for Airflow Metadata) ---
  postgres:
    image: postgres:16
    container_name: osrs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - osrs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Database (ClickHouse for Analytics) ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: osrs-clickhouse
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - osrs-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Apache Airflow (LocalExecutor) ---
  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: osrs-airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@osrs.local \
          --password admin
    networks:
      - osrs-net

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: osrs-airflow-webserver
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS}
      POSTGRES_HOST: osrs-postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8085:8080"
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags
      - ./services/dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    networks:
      - osrs-net

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: osrs-airflow-scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS}
      POSTGRES_HOST: osrs-postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags
      - ./services/dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    command: scheduler
    networks:
      - osrs-net

  fastapi-backend:
    build: ./services/fastapi-backend
    container_name: osrs-fastapi-backend
    ports:
      - "8006:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - osrs-net

  nextjs:
    build: ./services/nextjs
    container_name: osrs-nextjs
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://fastapi-backend:8000
    depends_on:
      fastapi-backend:
        condition: service_started
    networks:
      - osrs-net

  # --- Observability (Prometheus & Grafana) ---
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: osrs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - osrs-net

  grafana:
    image: grafana/grafana:10.3.3
    container_name: osrs-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - osrs-net
