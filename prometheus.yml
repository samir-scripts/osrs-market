global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'fastapi-producer'
    static_configs:
      - targets: ['fastapi-producer:8000']

  - job_name: 'fastapi-analytics'
    static_configs:
      - targets: ['fastapi-analytics:8001']
